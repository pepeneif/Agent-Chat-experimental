<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f1eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chat">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/theme.css">
<title>Chat</title>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <section id="loginView" class="hidden">
    <div class="login">
      <h1>Chat privado</h1>
      <p>Acceso solo para ti. Te enviamos un codigo de un solo uso a tu correo.</p>
      <div id="step1">
        <button id="btnToken">Enviarme el codigo por email</button>
        <div id="ok1" class="ok hidden">Codigo enviado. Revisa tu correo.</div>
      </div>
      <div id="step2" class="hidden">
        <label for="tok">Codigo recibido</label>
        <input id="tok" inputmode="text" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" placeholder="pega aqui el codigo">
        <button id="btnVerify">Entrar</button>
        <button id="btnResend" class="secondary">Enviar otro codigo</button>
      </div>
      <div id="err" class="err"></div>
    </div>
  </section>

  <!-- CHAT -->
  <header class="top hidden" id="topBar">
    <span class="dot"></span>
    <span class="brand">Manager</span>
    <span class="spacer"></span>
    <button class="ghost" id="btnNotify" title="Avisos">Avisos</button>
    <button class="ghost" id="btnDebug" title="Depurar el chat">Depurar</button>
    <button class="ghost" id="btnLogout" title="Salir">Salir</button>
  </header>

  <div id="pushBanner" class="pushbanner hidden">
    <span>Activa los avisos para que te suene el movil cuando te escriba.</span>
    <button id="btnPushGo">Activar</button>
  </div>

  <main id="scroll" class="hidden"></main>
  <div class="typing hidden" id="typing"><span id="typingText">Manager esta trabajando...</span></div>
  <div class="toast hidden" id="toast"></div>

  <footer class="composer hidden" id="composer">
    <button class="jump hidden" id="btnJump" title="Ir al final" aria-label="Ir al final">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="attachrow" id="attachrow"></div>
    <div class="row">
      <button class="icon" id="btnAttach" title="Adjuntar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.5 12.5 21a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7.5-7.5"/></svg>
      </button>
      <input type="file" id="file" class="hidden" multiple>
      <textarea id="text" rows="1" placeholder="Escribe... (Enter = linea nueva)"></textarea>
      <button class="icon send" id="btnSend" title="Enviar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 8 6 8-16-8z"/></svg>
      </button>
    </div>
  </footer>

</div>
<script src="/app.js"></script>
</body>
</html>
